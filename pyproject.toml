[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ux-app"
version = "0.2.0"
description = "Host-authored application layer on ux-dom + ux-channel. Components, Actions, any CEK domain."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "bitplorer" }]
keywords = ["ux-dom", "ux-channel", "cek", "server-driven-ui", "components"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Typing :: Typed",
]
dependencies = [
  # Declared peer cores. Not yet on PyPI — install from GitHub when you
  # want App.boot() against the live stack. App.bind() works without them.
  #   pip install "ux-dom @ git+https://github.com/bitplorer/ux-dom.git"
  #   pip install "ux-channel @ git+https://github.com/bitplorer/ux-channel.git#subdirectory=python"
]

[project.optional-dependencies]
cek = ["cek-host>=0.1.3", "cek-surface>=0.1.3"]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[project.scripts]
uxapp = "ux_app.cli.main:main"

[project.urls]
Homepage = "https://github.com/bitplorer/ux-app"
Repository = "https://github.com/bitplorer/ux-app"
Issues = "https://github.com/bitplorer/ux-app/issues"
Documentation = "https://github.com/bitplorer/ux-app/blob/main/START.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ux_app = ["py.typed", "stdlibs/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
norecursedirs = ["artifacts", "node_modules", "public", ".grok", "screenshots"]

[tool.ruff]
line-length = 88
target-version = "py310"
src = ["src", "tests"]
